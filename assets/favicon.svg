<!-- Site favicon: the D7 terminal prompt mark, drawn as vector so it stays
     crisp at any size and costs almost nothing to download. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0d1220"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none"
        stroke="#46e6d0" stroke-opacity="0.35" stroke-width="3"/>
  <!-- prompt chevron -->
  <path d="M16 22 L28 32 L16 42" fill="none" stroke="#46e6d0" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor underscore -->
  <rect x="34" y="37" width="16" height="5" rx="2.5" fill="#ffb454"/>
</svg>
